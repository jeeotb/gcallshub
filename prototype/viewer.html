<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Gcalls ContactHub · Prototype</title>
<style>
  :root { --bg: #E9E6F2; --ink: #1F1A33; --muted: #5E5878; --line: #D9D4E8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131019; --ink: #F4F2F8; --muted: #B4AEC6; --line: #2E2938; } .bar { background: #1C1824 !important; } .bar a { color: #CFC8FF !important; } }
  :root[data-theme="dark"] { --bg: #131019; --ink: #F4F2F8; --muted: #B4AEC6; --line: #2E2938; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Be Vietnam Pro", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .bar a { color: #5B3FC4; font-weight: 600; text-decoration: none; }
  .bar select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); max-width: 100%; }
  .bar .sp { flex: 1; }
  .bar .hint { font-size: 13px; color: var(--muted); }
  .stage { display: flex; justify-content: center; padding: 24px 16px 48px; }
  .phone { border-radius: 28px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(31,26,51,.45), 0 0 0 1px rgba(31,26,51,.08); }
  body.bare .bar { display: none; }
  body.bare .stage { padding: 0; }
  body.bare .phone { border-radius: 0; box-shadow: none; }
  .err { padding: 24px; color: #B00020; }
</style>
</head>
<body>
<div class="bar">
  <a href="gallery.html">← Tất cả màn hình</a>
  <select id="pick" aria-label="Chọn màn hình"></select>
  <span class="sp"></span>
  <span class="hint">Bấm như trên điện thoại: thanh tab và avatar chuyển màn.</span>
</div>
<div class="stage"><div class="phone" id="host"></div></div>
<script src="dc-lite.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('bare')) document.body.classList.add('bare');
  DcLite.setNight(params.get('night') === '1');
  var host = document.getElementById('host');
  var pick = document.getElementById('pick');

  var known = {};

  function show(name, push) {
    if (push) {
      var q = new URLSearchParams(location.search); q.set('s', name);
      history.pushState({ s: name }, '', '?' + q.toString());
    }
    pick.value = name;
    window.scrollTo(0, 0);
    DcLite.mount(host, name, function (next) {
      if (!known[next]) return; // màn đã bỏ khỏi bộ mockup
      if (document.body.classList.contains('bare')) { location.href = 'viewer.html?s=' + next; return; }
      show(next, true);
    }, { animate: !!push, anchor: document.body }).catch(function (e) { host.innerHTML = '<div class="err">' + e.message + '</div>'; });
  }

  fetch('canvas.json').then(function (r) { return r.json(); }).then(function (c) {
    c.order.forEach(function (file) {
      var o = document.createElement('option');
      o.value = file.replace('.dc.html', '');
      known[o.value] = true;
      o.textContent = (c.boards[file] && c.boards[file].title) || o.value;
      pick.appendChild(o);
    });
    var first = 'Main';
    show(known[params.get('s')] ? params.get('s') : first, false);
  });
  pick.addEventListener('change', function () { show(pick.value, true); });
  window.addEventListener('popstate', function () { var s = new URLSearchParams(location.search).get('s'); if (known[s]) show(s, false); });
})();
</script>
</body>
</html>
