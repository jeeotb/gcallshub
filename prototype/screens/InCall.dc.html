<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đang gọi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="background: linear-gradient(180deg, #3B2380 0%, #241552 55%, #1A1036 100%); color: #fff">
  <div style="height: 60px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Thu nhỏ cuộc gọi" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff"><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></a>
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FF6B8A"></span>Đang ghi âm</span>
    <span style="width: 44px"></span>
  </div>

  <div style="padding: 18px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <span style="width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.14); box-shadow: 0 0 0 8px rgba(255,255,255,.06), 0 0 0 18px rgba(255,255,255,.03); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; margin-bottom: 14px">LP</span>
    <div style="font-size: 24px; font-weight: 700; letter-spacing: -.02em">Lê Văn Phúc</div>
    <div class="num" style="font-size: 15px; color: rgba(255,255,255,.75)">0909 476 126</div>
    <div class="num" style="font-size: 17px; font-weight: 600; margin-top: 6px">{{ timer }}</div>
  </div>

  <a href="TaskTimeline.dc.html" style="margin: 22px 20px 0; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); display: flex; align-items: center; gap: 12px; color: #fff">
    <svg class="ico" style="color: #C9B6FF" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="m8 12 3 3 5-6"></path></svg>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12.5px; color: rgba(255,255,255,.7)">Việc đang mở · 15:00 hôm nay</span><span style="font-size: 14.5px; font-weight: 600">Gọi xác nhận lịch lắp đặt</span></span>
    <svg class="ico sm" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg>
  </a>

  <div style="position: absolute; left: 0; right: 0; bottom: 36px; padding: 0 28px; display: flex; flex-direction: column; gap: 28px">
    <sc-if value="{{ showPad }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div class="num" style="text-align: center; font-size: 22px; font-weight: 600; min-height: 32px">{{ dtmf }}</div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 22px; padding: 0 12px">
          <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
            <button type="button" onClick="{{ k.press }}" aria-label="Phím {{ k.d }}" style="height: 54px; border-radius: 27px; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; font-weight: 600">{{ k.d }}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ showGrid }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 12px">
        <sc-for list="{{ ctrls }}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{ c.press }}" aria-pressed="{{ c.on }}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; font-size: 12.5px; font-weight: 600">
            <span style="width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{ c.bg }}; color: {{ c.fg }}">
              <svg class="ico lg" viewBox="0 0 24 24"><path d="{{ c.d }}"></path></svg>
            </span>
            {{ c.t }}
          </button>
        </sc-for>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; justify-content: center; gap: 40px">
      <button type="button" onClick="{{ togglePad }}" aria-label="{{ padLabel }}" style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24"><path d="{{ padIcon }}"></path></svg></button>
      <a href="AfterCall.dc.html" aria-label="Kết thúc cuộc gọi" style="width: 74px; height: 74px; border-radius: 50%; background: #E5486B; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 28px -12px rgba(229,72,107,.9)"><svg class="ico lg" style="transform: rotate(135deg)" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></a>
      <span style="width: 52px"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mute: false, spk: true, hold: false, pad: false, dtmf: '' };
  }
  renderVals() {
    const S = this.state;
    const tog = (k) => () => this.setState({ [k]: !this.state[k] });
    const I = {
      mic: 'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3',
      micOff: 'M2 2l20 20M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.6M17 16.9A7 7 0 0 1 5 12v-2M19 10v2c0 .8-.1 1.5-.4 2.2M12 19v3',
      spk: 'M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14',
      hold: 'M8 5v14M16 5v14',
      xfer: 'M17 2l4 4-4 4M3 11V10a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3',
      note: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
      add: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM19 8v6M22 11h-6',
      pad: 'M5 4h.01M12 4h.01M19 4h.01M5 10h.01M12 10h.01M19 10h.01M5 16h.01M12 16h.01M19 16h.01M12 21h.01',
      x: 'M18 6 6 18M6 6l12 12'
    };
    const c = (t, d, on, press) => ({ t, d, on: on ? 'true' : 'false', press, bg: on ? '#fff' : 'rgba(255,255,255,.12)', fg: on ? '#3B2380' : '#fff' });
    const K = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'];
    return {
      timer: S.hold ? 'Đang giữ máy · 02:14' : '02:14',
      showPad: S.pad, showGrid: !S.pad,
      padIcon: S.pad ? I.x : I.pad,
      padLabel: S.pad ? 'Ẩn bàn phím' : 'Bàn phím',
      togglePad: tog('pad'),
      dtmf: S.dtmf,
      keys: K.map((d) => ({ d, press: () => this.setState({ dtmf: (this.state.dtmf + d).slice(-14) }) })),
      ctrls: [
        c(S.mute ? 'Đã tắt mic' : 'Tắt mic', S.mute ? I.micOff : I.mic, S.mute, tog('mute')),
        c('Loa ngoài', I.spk, S.spk, tog('spk')),
        c(S.hold ? 'Tiếp tục' : 'Giữ máy', I.hold, S.hold, tog('hold')),
        c('Chuyển tiếp', I.xfer, false, () => {}),
        c('Thêm người', I.add, false, () => {}),
        c('Ghi chú', I.note, false, () => {})
      ]
    };
  }
}
</script>
</body>
</html>
