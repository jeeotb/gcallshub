<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trạng thái trực</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <div style="position: absolute; inset: 0">
    <dc-import name="Main" hint-size="390px,844px"></dc-import>
  </div>
  <a class="scrim" href="Main.dc.html" aria-label="Đóng"></a>
  <div class="sheet" role="dialog" aria-label="Trạng thái trực">
    <div class="grab"></div>
    <div class="sheet-head">
      <div class="tt">
        <h2>Trạng thái trực</h2>
        <div class="meta">Máy nhánh 102 · tổng đài gcalls</div>
      </div>
      <a class="icon-btn" href="Main.dc.html" aria-label="Đóng"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
        <button type="button" class="{{ o.cls }}" onClick="{{ o.pick }}" style="text-align: left; width: 100%">
          <span style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{ o.bg }}; color: {{ o.fg }}; flex: none"><span class="dot" style="width: 10px; height: 10px"></span></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span class="ot">{{ o.title }}</span><span class="od">{{ o.desc }}</span></span>
          <span class="radio"></span>
        </button>
      </sc-for>
    </div>

    <div style="height: 1px; background: rgba(124,92,224,.1)"></div>

    <label style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Chỉ rung khi có thông báo</span><span class="meta">Không phát âm thanh; vẫn nhận cuộc gọi theo trạng thái ở trên</span></span>
      <span class="toggle" role="switch" aria-checked="false" aria-label="Chỉ rung"></span>
    </label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'ready' }; }
  renderVals() {
    const list = [
      { id: 'ready', title: 'Sẵn sàng', desc: 'Nhận cuộc gọi bình thường', bg: 'rgba(52,199,123,.14)', fg: '#1F9D5B' },
      { id: 'break', title: 'Tạm nghỉ', desc: 'Ăn trưa, nghỉ giải lao · tạm dừng nhận cuộc gọi', bg: 'rgba(246,173,85,.18)', fg: '#B7791F' },
      { id: 'dnd', title: 'Không làm phiền', desc: 'Đang bận xử lý việc', bg: 'rgba(229,72,107,.12)', fg: '#E5486B' },
      { id: 'off', title: 'Hết ca', desc: 'Ngừng nhận cuộc gọi đến ca sau', bg: 'rgba(117,112,144,.1)', fg: '#757090' }
    ];
    return {
      options: list.map((o) => ({ ...o, cls: o.id === this.state.picked ? 'opt on' : 'opt', pick: () => this.setState({ picked: o.id }) }))
    };
  }
}
</script>
</body>
</html>
