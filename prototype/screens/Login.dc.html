<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.btn.dis{opacity:.4;pointer-events:none}</style>
</helmet>
<div class="app">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <div style="padding: 96px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <span class="logo-badge" style="width: 76px; height: 76px; margin-bottom: 14px"><img src="assets/icons/logo-gcalls.svg" alt="Gcalls" style="width: 50px; height: 50px"></span>
    <h1 class="h1" style="margin: 0">Gcalls ContactHub</h1>
    <div style="font-size: 15px; color: #4A4463; max-width: 290px">Gọi, nghe, chăm sóc khách hàng ngay trên điện thoại.</div>
  </div>

  <div style="padding: 40px 24px 0; display: flex; flex-direction: column; gap: 14px">
    <div>
      <label class="field-label" for="lg-domain">Mã tổng đài</label>
      <div class="input" style="padding-right: 6px; background: #fff">
        <input id="lg-domain" value="{{ domain }}" onChange="{{ edit }}" placeholder="Ví dụ: congty" autocomplete="organization" style="flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font: inherit; color: #1F1A33">
        <span class="tag">Gcalls</span>
      </div>
      <div class="meta" style="margin-top: 8px">Do quản trị viên tổng đài cung cấp. Ứng dụng sẽ nhớ cho lần sau.</div>
    </div>
    <a class="{{ btnCls }}" href="Permissions.dc.html" style="margin-top: 6px">
      <svg class="ico sm" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Đăng nhập bằng Gcalls SSO
    </a>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <img class="mascot" src="assets/icons/mascot.svg" alt="" style="width: 56px">
    <div class="meta">ContactHub v1.2 · <a href="#" style="text-decoration: underline">Cần hỗ trợ?</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { domain: 'gcalls' };
  }
  renderVals() {
    const ok = this.state.domain.trim().length >= 2;
    return {
      domain: this.state.domain,
      edit: (e) => this.setState({ domain: e.target.value }),
      btnCls: 'btn primary block' + (ok ? '' : ' dis')
    };
  }
}
</script>
</body>
</html>
