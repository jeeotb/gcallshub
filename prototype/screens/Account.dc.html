<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tài khoản</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="height: 1160px">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <div class="layer">
    <header class="top">
      <span class="logo-badge"><img src="assets/icons/logo-gcalls.svg" alt="Gcalls"></span>
      <a class="status-pill" href="StatusSheet.dc.html" aria-label="Đổi trạng thái trực"><span class="live"></span>Sẵn sàng<span class="ext">· 102</span><svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></a>
      <div class="grow"></div>
      <a class="gbtn" href="Search.dc.html" aria-label="Tìm kiếm"><img class="i3d" src="assets/icons/search.svg" alt=""></a>
      <a class="gbtn" href="Notifications.dc.html" aria-label="Thông báo"><img class="i3d" src="assets/icons/bell.svg" alt=""><span class="pip"></span></a>
      <a class="me on" href="Account.dc.html" aria-label="Tài khoản"><img class="me-photo" src="assets/avatar-ly-hoang.jpg" alt=""></a>
    </header>

    <div class="body" style="gap: 24px">
      <div class="card" style="padding: 28px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
        <span class="av lg" style="width: 76px; height: 76px; font-size: 26px; margin-bottom: 8px"><img class="me-photo" src="assets/avatar-ly-hoang.jpg" alt="Ảnh đại diện ly.hoang"><span class="live" style="position: absolute; right: 4px; bottom: 4px; width: 14px; height: 14px; box-shadow: 0 0 0 3px #fff"></span></span>
        <div style="font-size: 20px; font-weight: 600">ly.hoang</div>
        <div class="meta">Tổng đài viên · ly.hoang@congty.vn</div>
        <div style="display: flex; gap: 8px; margin-top: 8px"><span class="tag">gcalls</span><span class="tag num">ID 44d552</span></div>
      </div>

      <a class="card row" href="StatusSheet.dc.html" style="border-radius: 28px">
        <span class="ev in" style="background: #ECF8F1; color: #1F9D5B"><span class="dot"></span></span>
        <div class="main"><div class="name">Sẵn sàng</div><div class="sub">Trạng thái trực</div></div>
        <svg class="ico" style="color: #757090" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg>
      </a>

      <div class="card">
        <div class="info"><span class="ic"><img class="i3d" src="assets/icons/phone.svg" alt=""></span><div class="main"><div class="k">Máy nhánh</div><div class="v num">102</div></div></div>
        <div class="info"><span class="ic"><img class="i3d" src="assets/icons/switchboard.svg" alt=""></span><div class="main"><div class="k">Tổng đài</div><div class="v">gcalls</div></div></div>
        <div class="info"><span class="ic"><img class="i3d" src="assets/icons/sso.svg" alt=""></span><div class="main"><div class="k">Đăng nhập</div><div class="v">Keycloak SSO</div></div><span class="dot" style="color: #34C77B"></span></div>
      </div>

      <div class="card">
        <a class="info" href="#"><span class="ic"><img class="i3d" src="assets/icons/language.svg" alt=""></span><div class="main"><div class="v">Tiếng Việt</div></div><svg class="ico" style="color: #757090" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg></a>
        <label class="info"><span class="ic"><img class="i3d" src="assets/icons/vibrate.svg" alt=""></span><div class="main"><div class="v">Chỉ rung</div></div><span class="toggle" role="switch" aria-checked="false" aria-label="Chỉ rung"></span></label>
      </div>

      <button class="btn ghost block" type="button" style="color: #E5486B"><img class="i3d" src="assets/icons/logout.svg" alt="">Đăng xuất</button>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
        <img class="mascot" src="assets/icons/mascot.svg" alt="Mascot Gcalls" style="width: 64px">
        <div class="meta">ContactHub v1.2 · Enterprise</div>
      </div>
    </div>

    <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ true }}">
    <nav class="{{ navCls }}" aria-label="Điều hướng chính">
      <a href="Main.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-overview.svg" alt=""></span>Tổng quan</a>
      <a href="Contacts.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-contacts.svg" alt=""></span>Danh bạ</a>
      <a href="History.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-history.svg" alt=""></span><span class="badge">1</span>Lịch sử</a>
      <a href="Tasks.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-tasks.svg" alt=""></span><span class="badge">99+</span>Công việc</a>
      <button type="button" class="nav-fold" onClick="{{ foldNav }}" aria-label="Thu gọn thanh điều hướng"><span class="mface"><img src="assets/icons/logo-gcalls.svg" alt=""></span></button>
    </nav>
    </sc-if>
    <sc-if value="{{ navClosed }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="{{ dockCls }}" onClick="{{ openNav }}" aria-label="Mở thanh điều hướng"><span class="mface"><img src="assets/icons/logo-gcalls.svg" alt=""></span><span class="dock-dot"></span></button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let nav = true;
    try { nav = window.localStorage.getItem('gch-nav') !== 'closed'; } catch (e) { /* storage blocked */ }
    this.state = { nav: nav };
  }
  renderVals() {
    return {
      navOpen: this.state.nav, navClosed: !this.state.nav,
      navCls: 'nav' + (this.state.navAnim ? ' pop' : ''), dockCls: 'nav-dock' + (this.state.navAnim ? ' pop' : ''),
      foldNav: () => { this.setState({ nav: false, navAnim: true }); setTimeout(() => this.setState({ navAnim: false }), 500); try { window.localStorage.setItem('gch-nav', 'closed'); } catch (e) {} },
      openNav: () => { this.setState({ nav: true, navAnim: true }); setTimeout(() => this.setState({ navAnim: false }), 500); try { window.localStorage.setItem('gch-nav', 'open'); } catch (e) {} },
    };
  }
}
</script>
</body>
</html>
