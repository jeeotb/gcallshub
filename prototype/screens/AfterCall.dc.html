<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kết thúc cuộc gọi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <header class="sub-top">
    <a class="icon-btn" href="History.dc.html" aria-label="Đóng"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    <div class="t">Kết thúc cuộc gọi</div>
    <span style="width: 44px"></span>
  </header>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div class="card" style="padding: 16px; display: flex; align-items: center; gap: 14px">
      <span class="av" style="width: 48px; height: 48px; font-size: 16px"><img class="av-photo" src="assets/people/p2.jpg" alt=""></span>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 16px; font-weight: 600">Lê Văn Phúc</div>
        <div class="meta num">Gọi đi · 2 phút 14 giây · 15:02</div>
      </div>
      <span class="tag ok">Đã kết nối</span>
    </div>

    <div>
      <div class="field-label">Kết quả cuộc gọi</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ results }}" as="r" hint-placeholder-count="5">
          <button type="button" class="{{ r.cls }}" onClick="{{ r.pick }}">{{ r.t }}</button>
        </sc-for>
      </div>
    </div>

    <div>
      <label class="field-label" for="ac-note">Ghi chú <span class="meta" style="font-weight: 500">· lưu vào hồ sơ khách hàng</span></label>
      <textarea id="ac-note" class="input area" style="resize: none; height: 88px" placeholder="Khách đã xác nhận, hẹn kỹ thuật đến lúc..."></textarea>
    </div>

    <div class="card">
      <label class="info" style="min-height: 64px">
        <span class="ic"><svg class="ico sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="m8 12 3 3 5-6"></path></svg></span>
        <div class="main"><div class="v" style="font-size: 14.5px">Hoàn thành việc</div><div class="meta">Gọi xác nhận lịch lắp đặt</div></div>
        <button type="button" class="{{ doneCls }}" onClick="{{ togDone }}" role="switch" aria-checked="{{ doneAria }}" aria-label="Hoàn thành việc"></button>
      </label>
      <label class="info" style="min-height: 64px">
        <span class="ic"><svg class="ico sm" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"></path></svg></span>
        <div class="main"><div class="v" style="font-size: 14.5px">Hẹn gọi lại</div><div class="meta">Tạo nhắc hẹn cho khách này</div></div>
        <button type="button" class="{{ remCls }}" onClick="{{ togRem }}" role="switch" aria-checked="{{ remAria }}" aria-label="Hẹn gọi lại"></button>
      </label>
      <sc-if value="{{ rem }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 0 18px 16px; display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{ whens }}" as="w" hint-placeholder-count="3">
            <button type="button" class="{{ w.cls }}" onClick="{{ w.pick }}">{{ w.t }}</button>
          </sc-for>
          <a class="chip" href="CreateReminder.dc.html">Chọn giờ khác</a>
        </div>
      </sc-if>
    </div>
  </div>

  <div class="foot" style="position: absolute; left: 20px; right: 20px; bottom: 116px">
    <a class="btn ghost" href="History.dc.html" style="flex: 1">Bỏ qua</a>
    <a class="btn primary" href="History.dc.html" style="flex: 2">Lưu kết quả</a>
  </div>
    <nav class="nav" aria-label="Điều hướng chính">
      <a href="Main.dc.html"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>Tổng quan</a>
      <a href="Contacts.dc.html"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Danh bạ</a>
      <a href="History.dc.html" class="on"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"></path></svg></span><span class="badge">1</span>Lịch sử</a>
      <a href="Tasks.dc.html"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></span><span class="badge">99+</span>Công việc</a>
    </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { res: 0, done: true, rem: false, when: 0 };
  }
  renderVals() {
    const S = this.state;
    const R = ['Thành công', 'Hẹn gọi lại', 'Không nghe máy', 'Máy bận', 'Sai số'];
    const W = ['Chiều nay 17:00', 'Sáng mai 09:00', 'Thứ Hai 09:00'];
    return {
      results: R.map((t, k) => ({ t, cls: 'chip' + (S.res === k ? ' on' : ''), pick: () => this.setState({ res: k, rem: k === 1 ? true : this.state.rem }) })),
      doneCls: 'toggle' + (S.done ? ' on' : ''), doneAria: S.done ? 'true' : 'false', togDone: () => this.setState({ done: !this.state.done }),
      remCls: 'toggle' + (S.rem ? ' on' : ''), remAria: S.rem ? 'true' : 'false', togRem: () => this.setState({ rem: !this.state.rem }),
      rem: S.rem,
      whens: W.map((t, k) => ({ t, cls: 'chip' + (S.when === k ? ' on' : ''), pick: () => this.setState({ when: k }) }))
    };
  }
}
</script>
</body>
</html>
