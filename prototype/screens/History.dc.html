<x-dc>

  <div class="layer">
    <header class="top">
      <span class="logo-badge"><img src="assets/icons/logo-gcalls.svg" alt="Gcalls"></span>
      <a class="status-pill" href="StatusSheet.dc.html" aria-label="Đổi trạng thái trực"><span class="live"></span>Sẵn sàng<span class="ext">· 102</span><svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></a>
      <div class="grow"></div>
      <a class="gbtn" href="Search.dc.html" aria-label="Tìm kiếm"><img class="i3d" src="assets/icons/search.svg" alt=""></a>
      <a class="gbtn" href="Notifications.dc.html" aria-label="Thông báo"><img class="i3d" src="assets/icons/bell.svg" alt=""><span class="pip"></span></a>

    <div class="body" style="gap: 24px">

      </div>

      <div class="chips">
        <button class="chip on" type="button">Tất cả</button>
        <button class="chip" type="button">Cuộc gọi</button>
        <button class="chip" type="button">Gọi nhỡ <span class="n">1</span></button>
        <button class="chip" type="button">Tin nhắn</button>
      </div>

      <div>
        <div class="day"><span>Hôm qua</span></div>
        <div class="card">
          <a class="row" href="CallDetail.dc.html">
            <span class="ev out"><img class="i3d" src="assets/icons/call-outgoing.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub num">0:32 <img class="i3d" src="assets/icons/recording.svg" alt="" style="width: 13px"></div></div>
            <span class="time">13:46</span>
          </a>
        </div>
      </div>

      <div>
        <div class="day"><span>Thứ Hai, 05/10</span></div>
        <div class="card">
          <a class="row" href="CallDetail.dc.html">
            <span class="ev miss"><img class="i3d" src="assets/icons/call-missed.svg" alt=""></span>
            <div class="main"><div class="name">Trần Thu Hà</div><div class="sub"><span class="red">Gọi nhỡ</span></div></div>
            <span class="time">21:20</span>
          </a>
          <a class="row" href="CallDetail.dc.html">
            <span class="ev out"><img class="i3d" src="assets/icons/call-outgoing.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub num">0:05 <img class="i3d" src="assets/icons/recording.svg" alt="" style="width: 13px"></div></div>
            <span class="time">17:55</span>
          </a>
          <a class="row" href="CallDetail.dc.html">
            <span class="ev in"><img class="i3d" src="assets/icons/call-incoming.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub num">0:01</div></div>
            <span class="time">11:45</span>
          </a>
          <a class="row" href="CallDetail.dc.html">
            <span class="ev sms"><img class="i3d" src="assets/icons/sms.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub">SMS</div></div>
            <span class="time">11:13</span>
          </a>
        </div>
      </div>
    </div>

    <a class="fab dial" href="Dialer.dc.html" aria-label="Mở bàn phím quay số"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h.01M12 4h.01M19 4h.01M5 10h.01M12 10h.01M19 10h.01M5 16h.01M12 16h.01M19 16h.01M12 21h.01"></path></svg></a>

    <nav class="nav" aria-label="Điều hướng chính">
      <a href="Main.dc.html"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>Tổng quan</a>
      <a href="Contacts.dc.html"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Danh bạ</a>
      <a href="History.dc.html" class="on"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"></path></svg></span><span class="badge">1</span>Lịch sử</a>
      <a href="Tasks.dc.html"><span class="pill"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></span><span class="badge">99+</span>Công việc</a>
    </nav>

</div>
