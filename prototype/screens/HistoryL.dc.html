<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lịch sử · Light</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app lt">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <div class="layer">
    <header class="top">
      <span class="logo-badge"><img src="assets/icons/logo-gcalls.svg" alt="Gcalls"></span>
      <a class="status-pill" href="StatusSheet.dc.html" aria-label="Đổi trạng thái trực"><span class="live"></span>Sẵn sàng<span class="ext">· 102</span><svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></a>
      <div class="grow"></div>
      <a class="gbtn" href="Search.dc.html" aria-label="Tìm kiếm"><img class="i3d" src="assets/icons/search.svg" alt=""></a>
      <a class="gbtn" href="Notifications.dc.html" aria-label="Thông báo"><img class="i3d" src="assets/icons/bell.svg" alt=""><span class="pip"></span></a>
      <a class="me" href="AccountL.dc.html" aria-label="Tài khoản"><img class="me-photo" src="assets/avatar-ly-hoang.jpg" alt=""></a>
    </header>

    <div class="body" style="gap: 24px">
      <div style="padding: 0 6px; display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: baseline; gap: 10px"><h1 class="h1" style="margin: 0">Lịch sử</h1><span class="tag">7 ngày</span></div>
        <a class="gbtn" href="HistoryFilter.dc.html" aria-label="Bộ lọc nâng cao" style="width: 46px; height: 46px"><img class="i3d" src="assets/icons/filter.svg" alt=""></a>
      </div>

      <div class="chips">
        <button class="chip on" type="button">Tất cả</button>
        <button class="chip" type="button">Cuộc gọi</button>
        <button class="chip" type="button">Gọi nhỡ <span class="n">1</span></button>
        <button class="chip" type="button">Tin nhắn</button>
      </div>

      <div>
        <div class="day"><span>Hôm qua</span></div>
        <div class="card">
          <a class="row" href="CallDetail.dc.html">
            <span class="ev out"><img class="i3d" src="assets/icons/call-outgoing.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub num">0:32 <img class="i3d" src="assets/icons/recording.svg" alt="" style="width: 13px"></div></div>
            <span class="time">13:46</span>
          </a>
        </div>
      </div>

      <div>
        <div class="day"><span>Thứ Hai, 05/10</span></div>
        <div class="card">
          <a class="row" href="CallDetail.dc.html">
            <span class="ev miss"><img class="i3d" src="assets/icons/call-missed.svg" alt=""></span>
            <div class="main"><div class="name">Trần Thu Hà</div><div class="sub"><span class="red">Gọi nhỡ</span></div></div>
            <span class="time">21:20</span>
          </a>
          <a class="row" href="CallDetail.dc.html">
            <span class="ev out"><img class="i3d" src="assets/icons/call-outgoing.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub num">0:05 <img class="i3d" src="assets/icons/recording.svg" alt="" style="width: 13px"></div></div>
            <span class="time">17:55</span>
          </a>
          <a class="row" href="CallDetail.dc.html">
            <span class="ev in"><img class="i3d" src="assets/icons/call-incoming.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub num">0:01</div></div>
            <span class="time">11:45</span>
          </a>
          <a class="row" href="CallDetail.dc.html">
            <span class="ev sms"><img class="i3d" src="assets/icons/sms.svg" alt=""></span>
            <div class="main"><div class="name">Nguyễn Thiên</div><div class="sub">SMS</div></div>
            <span class="time">11:13</span>
          </a>
        </div>
      </div>
    </div>

    <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ true }}">
    <nav class="nav" aria-label="Điều hướng chính">
      <a href="MainL.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-overview.svg" alt=""></span>Tổng quan</a>
      <a href="ContactsL.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-contacts.svg" alt=""></span>Danh bạ</a>
      <a href="HistoryL.dc.html" class="on"><span class="pill"><img class="i3d" src="assets/icons/nav-history.svg" alt=""></span><span class="badge">1</span>Lịch sử</a>
      <a href="TasksL.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-tasks.svg" alt=""></span><span class="badge">99+</span>Công việc</a>
      <button type="button" class="nav-fold" onClick="{{ foldNav }}" aria-label="Thu gọn thanh điều hướng"><span class="mface"><img src="assets/icons/logo-gcalls.svg" alt=""></span></button>
    </nav>
    </sc-if>
    <sc-if value="{{ navClosed }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="nav-dock" onClick="{{ openNav }}" aria-label="Mở thanh điều hướng"><span class="mface"><img src="assets/icons/logo-gcalls.svg" alt=""></span><span class="dock-dot"></span></button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let nav = true;
    try { nav = window.localStorage.getItem('gch-nav') !== 'closed'; } catch (e) { /* storage blocked */ }
    this.state = { nav: nav };
  }
  renderVals() {
    return {
      navOpen: this.state.nav, navClosed: !this.state.nav,
      foldNav: () => { this.setState({ nav: false }); try { window.localStorage.setItem('gch-nav', 'closed'); } catch (e) {} },
      openNav: () => { this.setState({ nav: true }); try { window.localStorage.setItem('gch-nav', 'open'); } catch (e) {} },
    };
  }
}
</script>
</body>
</html>
