<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chi tiết cuộc gọi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <div style="position: absolute; inset: 0">
    <dc-import name="History" hint-size="390px,844px"></dc-import>
  </div>
  <a class="scrim" href="History.dc.html" aria-label="Đóng"></a>
  <div class="sheet" role="dialog" aria-label="Chi tiết cuộc gọi">
    <div class="grab"></div>
    <div class="sheet-head" style="align-items: center; gap: 12px">
      <span class="av lg" style="width: 56px; height: 56px; font-size: 19px">NT</span>
      <div class="tt">
        <h2 style="font-size: 17px">Nguyễn Thiên – ĐH Quốc Tế</h2>
        <div class="meta">0364 562 493 · Gcalls</div>
      </div>
      <a class="icon-btn" href="History.dc.html" aria-label="Đóng"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    </div>

    <div class="grid2" style="gap: 8px">
      <div style="background: rgba(255,255,255,.6); border-radius: 12px; padding: 10px 12px"><div class="meta">Thời gian</div><div style="font-weight: 700">17:55 · 05/10</div></div>
      <div style="background: rgba(255,255,255,.6); border-radius: 12px; padding: 10px 12px"><div class="meta">Thời lượng</div><div style="font-weight: 700">0 phút 5 giây</div></div>
      <div style="background: rgba(255,255,255,.6); border-radius: 12px; padding: 10px 12px"><div class="meta">Kênh</div><div style="font-weight: 700; display: flex; align-items: center; gap: 6px"><svg class="ico sm" style="color: #5B3FC4" viewBox="0 0 24 24"><path d="M16 2h6v6M22 2l-7 7"></path><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3"></path></svg>Cuộc gọi đi</div></div>
      <div style="background: rgba(255,255,255,.6); border-radius: 12px; padding: 10px 12px"><div class="meta">Trạng thái</div><div style="font-weight: 700; display: flex; align-items: center; gap: 6px; color: #1F9D5B"><span class="dot"></span>Đã kết nối</div></div>
    </div>

    <div style="border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(124,92,224,.12); padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 14px; font-weight: 700">Bản ghi cuộc gọi</span><button class="tag brand" type="button">Tốc độ 1x</button></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" aria-label="Phát bản ghi" style="width: 44px; height: 44px; border-radius: 50%; background: #7C5CE0; color: #fff; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ico" style="fill: currentColor; stroke: none; margin-left: 2px" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"></path></svg></button>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <div style="position: relative; height: 6px; border-radius: 3px; background: rgba(124,92,224,.12)"><div style="width: 0%; height: 6px; border-radius: 3px; background: #7C5CE0"></div><span style="position: absolute; left: -2px; top: -4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #7C5CE0"></span></div>
          <div style="display: flex; justify-content: space-between; font-size: 12.5px; color: #757090"><span>0:00</span><span>0:05</span></div>
        </div>
      </div>
    </div>

    <div class="foot">
      <a class="btn ghost" href="Customer.dc.html" style="flex: 1">Hồ sơ khách hàng</a>
      <button class="btn call" type="button" style="flex: 1"><svg class="ico sm" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Gọi lại</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
