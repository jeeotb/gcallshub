<div class="app lt">

  <div class="layer">

          <span style="position: absolute; left: -9999px">Tìm khách hàng</span>

      </div>

      <div class="seg">
        <button class="on" type="button">Khách hàng</button>
        <button type="button">Nhóm <span class="n">0</span></button>
      </div>

      <div class="card">
        <div class="letter"><span>A</span></div>

          <a class="more-btn" href="ContactQuick.dc.html" aria-label="Thêm thao tác"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></a>
        </div>
        <div class="letter" style="border-top: 1px solid rgba(124,92,224,.1)"><span>B</span></div>
        <div class="row" style="border-top: 0">
          <span class="av">BN</span>
          <div class="main"><div class="name">Bảo Ngọc</div><div class="sub num">0912 345 678</div></div>
          <button class="call-btn" type="button" aria-label="Gọi Bảo Ngọc"><img class="i3d" src="assets/icons/phone.svg" alt=""></button>
          <a class="more-btn" href="ContactQuick.dc.html" aria-label="Thêm thao tác"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></a>
        </div>
        <div class="letter" style="border-top: 1px solid rgba(124,92,224,.1)"><span>D</span></div>
        <div class="row" style="border-top: 0">
          <span class="av">DT</span>
          <div class="main"><div class="name">Dũng Trần</div><div class="sub num">0983 111 222</div></div>
          <button class="call-btn" type="button" aria-label="Gọi Dũng Trần"><img class="i3d" src="assets/icons/phone.svg" alt=""></button>
          <a class="more-btn" href="ContactQuick.dc.html" aria-label="Thêm thao tác"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></a>
        </div>
        <div class="row">
          <span class="av">DL</span>
          <div class="main"><div class="name">Dương Lan</div><div class="sub num">0904 555 010</div></div>

          <a class="more-btn" href="ContactQuick.dc.html" aria-label="Thêm thao tác"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></a>
        </div>
        <div class="letter" style="border-top: 1px solid rgba(124,92,224,.1)"><span>H</span></div>
        <div class="row" style="border-top: 0">
          <span class="av">HN</span>
          <div class="main"><div class="name">Hoàng Nam</div><div class="sub num">0888 743 000</div></div>
          <button class="call-btn" type="button" aria-label="Gọi Hoàng Nam"><img class="i3d" src="assets/icons/phone.svg" alt=""></button>
          <a class="more-btn" href="ContactQuick.dc.html" aria-label="Thêm thao tác"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></a>

    <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ true }}">
    <nav class="nav" aria-label="Điều hướng chính">
      <a href="MainL.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-overview.svg" alt=""></span>Tổng quan</a>
      <a href="ContactsL.dc.html" class="on"><span class="pill"><img class="i3d" src="assets/icons/nav-contacts.svg" alt=""></span>Danh bạ</a>
      <a href="HistoryL.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-history.svg" alt=""></span><span class="badge">1</span>Lịch sử</a>
      <a href="TasksL.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-tasks.svg" alt=""></span><span class="badge">99+</span>Công việc</a>
      <button type="button" class="nav-fold" onClick="{{ foldNav }}" aria-label="Thu gọn thanh điều hướng"><span class="mface"><img src="assets/icons/logo-gcalls.svg" alt=""></span></button>
    </nav>
    </sc-if>
    <sc-if value="{{ navClosed }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="nav-dock" onClick="{{ openNav }}" aria-label="Mở thanh điều hướng"><span class="mface"><img src="assets/icons/logo-gcalls.svg" alt=""></span><span class="dock-dot"></span></button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let nav = true;
    try { nav = window.localStorage.getItem('gch-nav') !== 'closed'; } catch (e) { /* storage blocked */ }
    this.state = { nav: nav };
  }
  renderVals() {
    return {
      navOpen: this.state.nav, navClosed: !this.state.nav,
      foldNav: () => { this.setState({ nav: false }); try { window.localStorage.setItem('gch-nav', 'closed'); } catch (e) {} },
      openNav: () => { this.setState({ nav: true }); try { window.localStorage.setItem('gch-nav', 'open'); } catch (e) {} },
    };
  }
}
</script>
</body>
</html>
