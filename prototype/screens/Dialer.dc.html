<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bàn phím quay số</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <header class="sub-top">
    <a class="icon-btn" href="History.dc.html" aria-label="Quay lại"><svg class="ico" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"></path></svg></a>
    <div class="t">Bàn phím</div>
    <a class="icon-btn" href="Contacts.dc.html" aria-label="Mở danh bạ"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </header>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <button class="input" type="button" style="height: 44px; justify-content: space-between; color: #1F1A33">
      <span style="display: flex; align-items: center; gap: 8px"><span class="meta">Gọi ra bằng</span><b style="font-weight: 600">102 · [ĐẦU SỐ HIỂN THỊ]</b></span>
      <svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
    </button>

    <div style="height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <span class="num" style="font-size: 34px; font-weight: 600; letter-spacing: .02em; color: #1F1A33">{{ shown }}</span>
    </div>

    <div style="min-height: 74px">
      <sc-if value="{{ hasMatch }}" hint-placeholder-val="{{ true }}">
        <div class="card">
          <sc-for list="{{ matches }}" as="m" hint-placeholder-count="1">
            <a class="row" href="ContactQuick.dc.html" style="min-height: 64px; padding-top: 10px; padding-bottom: 10px">
              <span class="av" style="width: 38px; height: 38px; font-size: 13px">{{ m.i }}</span>
              <div class="main"><div class="name">{{ m.n }}</div><div class="sub num">{{ m.f }}</div></div>
              <span class="meta">Khớp danh bạ</span>
            </a>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ noMatch }}" hint-placeholder-val="{{ false }}">
        <div class="hint" style="justify-content: center">Số mới, chưa có trong danh bạ</div>
      </sc-if>
    </div>
  </div>

  <div class="dpad-wrap">
    <div class="dpad">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
        <button type="button" class="dkey" onClick="{{ k.press }}" aria-label="Phím {{ k.d }}">
          <span class="dk-d">{{ k.d }}</span>
          <span class="dk-l">{{ k.l }}</span>
        </button>
      </sc-for>
    </div>
    <div class="dpad dpad-actions">
      <a href="SendSms.dc.html" class="dact" aria-label="Nhắn tin tới số này"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"></path></svg></a>
      <a href="InCall.dc.html" class="dcall" aria-label="Gọi"><svg class="ico lg" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></a>
      <button type="button" class="dact" onClick="{{ del }}" aria-label="Xoá số cuối"><svg class="ico" viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="m17 9-5 6M12 9l5 6"></path></svg></button>
    </div>
  </div>
    <nav class="nav" aria-label="Điều hướng chính">
      <a href="Main.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-overview.svg" alt=""></span>Tổng quan</a>
      <a href="Contacts.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-contacts.svg" alt=""></span>Danh bạ</a>
      <a href="History.dc.html" class="on"><span class="pill"><img class="i3d" src="assets/icons/nav-history.svg" alt=""></span><span class="badge">1</span>Lịch sử</a>
      <a href="Tasks.dc.html"><span class="pill"><img class="i3d" src="assets/icons/nav-tasks.svg" alt=""></span><span class="badge">99+</span>Công việc</a>
    </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { num: '09094' };
  }
  renderVals() {
    const C = [
      { n: 'Anh Hoàng', p: '0901234567', i: 'AH' },
      { n: 'Bảo Ngọc', p: '0912345678', i: 'BN' },
      { n: 'Dũng Trần', p: '0983111222', i: 'DT' },
      { n: 'Dương Lan', p: '0904555010', i: 'DL' },
      { n: 'Hoàng Nam', p: '0888743000', i: 'HN' },
      { n: 'Nguyễn Thiên – ĐH Quốc Tế', p: '0364562493', i: 'NT' },
      { n: 'Trần Thu Hà', p: '0845676622', i: 'TH' },
      { n: 'Lê Văn Phúc', p: '0909476126', i: 'LP' }
    ];
    const fmt = (s) => [s.slice(0, 4), s.slice(4, 7), s.slice(7, 10), s.slice(10)].filter(Boolean).join(' ');
    const num = this.state.num;
    const matches = num.length >= 2 ? C.filter((c) => c.p.indexOf(num) >= 0).slice(0, 2).map((c) => ({ n: c.n, i: c.i, f: fmt(c.p) })) : [];
    const K = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'], ['*', ''], ['0', '+'], ['#', '']];
    return {
      shown: num ? fmt(num) : 'Nhập số',
      matches,
      hasMatch: matches.length > 0,
      noMatch: num.length >= 2 && matches.length === 0,
      keys: K.map(([d, l]) => ({ d, l, press: () => { if (this.state.num.length < 13) this.setState({ num: this.state.num + d }); } })),
      del: () => this.setState({ num: this.state.num.slice(0, -1) })
    };
  }
}
</script>
</body>
</html>
