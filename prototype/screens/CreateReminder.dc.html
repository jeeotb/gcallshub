<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tạo nhắc hẹn</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/contacthub.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="wall" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <div style="position: absolute; inset: 0">
    <dc-import name="Tasks" hint-size="390px,844px"></dc-import>
  </div>
  <a class="scrim" href="Tasks.dc.html" aria-label="Đóng"></a>
  <div class="sheet" role="dialog" aria-label="Tạo nhắc hẹn" style="gap: 14px">
    <div class="grab"></div>
    <div class="sheet-head">
      <div class="tt"><h2>Tạo nhắc hẹn</h2><div class="meta">Lưu trong ContactHub, không ghi ngược về hệ thống nguồn</div></div>
      <a class="icon-btn" href="Tasks.dc.html" aria-label="Đóng"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    </div>

    <div>
      <div class="field-label"><svg class="ico sm" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Khách hàng</div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 12px; box-shadow: inset 0 0 0 2px #7C5CE0; background: rgba(255,255,255,.55)">
        <span class="av" style="width: 34px; height: 34px; border-radius: 10px; font-size: 12px"><img class="av-photo" src="assets/people/p2.jpg" alt=""></span>
        <div style="flex: 1"><div style="font-weight: 700; font-size: 14px">Lê Văn Phúc</div><div class="meta">0909 476 126</div></div>
        <button class="btn sm ghost" type="button">Đổi</button>
      </div>
    </div>

    <div>
      <label class="field-label" for="r-title">Nội dung công việc</label>
      <input id="r-title" class="input" style="color: #1F1A33" placeholder="Ví dụ: Gọi xác nhận lịch lắp đặt" value="Gọi xác nhận lịch lắp đặt">
    </div>

    <div>
      <label class="field-label" for="r-note">Ghi chú <span class="meta" style="font-weight: 500">· không bắt buộc</span></label>
      <textarea id="r-note" class="input area" style="resize: none" placeholder="Thông tin cần nhớ khi chăm sóc khách hàng"></textarea>
    </div>

    <div>
      <div class="field-label"><svg class="ico sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Thời gian</div>
      <div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px">
        <button class="input" type="button" style="color: #1F1A33; justify-content: space-between">Thứ Sáu, 09/10<svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></button>
        <button class="input" type="button" style="color: #1F1A33; justify-content: space-between">09:00<svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
    </div>

    <div>
      <div class="field-label">Ưu tiên</div>
      <div class="seg">
        <button type="button">Thấp</button>
        <button class="on" type="button">Thường</button>
        <button type="button">Cao</button>
        <button type="button">Khẩn</button>
      </div>
    </div>

    <div>
      <div class="field-label"><svg class="ico sm" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>Lặp lại</div>
      <div class="seg">
        <button class="on" type="button">Không</button>
        <button type="button">Hằng ngày</button>
        <button type="button">Hằng tuần</button>
        <button type="button">Hằng tháng</button>
      </div>
    </div>

    <a class="btn primary block" href="Tasks.dc.html"><svg class="ico sm" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Tạo nhắc hẹn</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
